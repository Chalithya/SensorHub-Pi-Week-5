<!DOCTYPE html>
<html>
<head>
  <title>Sensor Graphs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .navbar {
      background-color: #333;
      overflow: hidden;
    }

    .navbar a {
      float: left;
      display: block;
      color: #f2f2f2;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
    }

    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }

    h1, h2 {
      text-align: center;
      margin-top: 20px;
    }

    img {
      display: block;
      margin: 20px auto;
      width: 90%;
      max-width: 900px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="/">3D Orientation (Live)</a>
    <a href="/graphs">Sensor Graphs</a>
  </div>

  <h1>Sensor Data Visualization</h1>

  <h2>Acceleration Data</h2>
  <img src="{{ url_for('static', filename='acceleration_plot.png') }}" alt="Acceleration Data">

  <h2>Gyroscope Data</h2>
  <img src="{{ url_for('static', filename='gyroscope_plot.png') }}" alt="Gyroscope Data">

  <h2>3D Orientation (Pitch, Roll, Yaw)</h2>
  <img src="{{ url_for('static', filename='orientation_3d_plot.png') }}" alt="3D Orientation Plot">

  <h2>3D Orientation Over Time</h2>
  <img src="{{ url_for('static', filename='orientation_time_plot.png') }}" alt="Pitch Roll Yaw Time">

</body>
</html>
